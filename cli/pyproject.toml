[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clanker-cli"
version = "0.1.0"
dependencies = [
    "click>=8.1",
    "rich>=13.0",   # optional but nice
]

[project.scripts]
clanker = "clanker.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
