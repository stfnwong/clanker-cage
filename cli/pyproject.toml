[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clanker-cli"
version = "0.1.0"
dependencies = [
    "click>=8.1",
    "rich>=13.0",   # optional but nice
]

[project.scripts]
clanker = "clanker.cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "ipython>=9.16.1",
    "pudb>=2025.1.5",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
